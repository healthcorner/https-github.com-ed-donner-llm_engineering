<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple to-do list that stays in your browser." />
    <title>To-do</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f5d45'/%3E%3Cpath d='M4 8.2 6.4 10.6 12 5.2' fill='none' stroke='%23f3eee4' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <p class="eyebrow">To-do</p>
        <h1 id="today-heading">Today</h1>
        <p class="lede">Write it down. Check it off. That is the whole app.</p>
      </header>

      <main>
        <form id="new-todo-form" class="composer" autocomplete="off">
          <label class="visually-hidden" for="new-todo">New task</label>
          <input
            id="new-todo"
            name="task"
            type="text"
            maxlength="240"
            placeholder="What needs doing?"
            required
          />
          <button type="submit">Add</button>
        </form>

        <section class="board" aria-labelledby="list-heading">
          <div class="toolbar">
            <h2 id="list-heading" class="visually-hidden">Tasks</h2>
            <p id="status-count" class="status-count" aria-live="polite"></p>
            <div class="filters" role="group" aria-label="Filter tasks">
              <button type="button" data-filter="all" class="is-active">All</button>
              <button type="button" data-filter="active">Open</button>
              <button type="button" data-filter="completed">Done</button>
            </div>
          </div>

          <ul id="todo-list" class="todo-list"></ul>

          <p id="empty-message" class="empty" hidden></p>

          <div class="footer-actions">
            <button type="button" id="clear-completed" hidden>Clear completed</button>
          </div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
